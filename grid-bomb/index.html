<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#06090f">
<title>GRID BOMB · 그리드 봄 택틱스</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
:root{
  --tile:56px;
  --cyan:#2de2ff; --amber:#ffb02e; --red:#ff4d5e; --magenta:#c86bff; --orange:#ff8a3d;
  --txt:#e9f2ff; --dim:#7b8ea8; --line:#1d2b40;
}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#05070c;}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard",system-ui,"Segoe UI",sans-serif;
  color:var(--txt);position:fixed;inset:0;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;
  -webkit-font-smoothing:antialiased;
}
#app{
  position:relative;height:100vh;height:100dvh;display:flex;flex-direction:column;
  width:100%;max-width:520px;margin:0 auto;
  box-shadow:0 0 0 1px rgba(45,150,200,.08), 0 0 90px rgba(0,0,0,.9);
  padding-top:calc(env(safe-area-inset-top,0px) + 6px);
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 10px);
  padding-left:calc(env(safe-area-inset-left,0px) + 12px);
  padding-right:calc(env(safe-area-inset-right,0px) + 12px);
  background:
    radial-gradient(95% 55% at 50% -5%, rgba(45,226,255,.10), rgba(45,226,255,0) 60%),
    radial-gradient(85% 45% at 50% 108%, rgba(255,138,61,.08), rgba(255,138,61,0) 60%),
    #06090f;
  overflow:hidden;
}
#app::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:0;
  background-image:
    linear-gradient(rgba(70,150,190,.055) 1px, transparent 1px),
    linear-gradient(90deg, rgba(70,150,190,.055) 1px, transparent 1px);
  background-size:32px 32px;
  opacity:.75;
}

/* ---------- HUD ---------- */
#hud{position:relative;z-index:2;display:flex;align-items:flex-start;justify-content:space-between;padding:0 6px 6px;gap:8px;}
.hb{display:flex;flex-direction:column;gap:2px;min-width:56px;}
.hb.mid{align-items:center;flex:1;}
.hb.right{align-items:flex-end;}
.hb .k{font-size:9px;letter-spacing:.22em;font-weight:800;color:var(--dim);}
.hb .v{font-size:22px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
.hb .v.wave{color:var(--cyan);text-shadow:0 0 16px rgba(45,226,255,.55);}
.hb .v.score{color:var(--amber);text-shadow:0 0 16px rgba(255,176,46,.45);}
.hearts{display:flex;gap:5px;font-size:19px;line-height:1;letter-spacing:1px;}
.hearts .on{color:#ff5d6e;text-shadow:0 0 12px rgba(255,77,94,.8);}
.hearts .off{color:#2c3a4d;}
.hearts .on.pop{animation:hpPop .4s ease;}
@keyframes hpPop{0%{transform:scale(1.6);color:#fff;}100%{transform:scale(1);}}
.sub{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:600;white-space:nowrap;}

/* ---------- stage / board ---------- */
#stage{position:relative;z-index:1;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;}
#board{position:relative;border-radius:16px;touch-action:none;}
#board::after{
  content:"";position:absolute;inset:-7px;border-radius:22px;pointer-events:none;
  box-shadow:0 0 0 1px rgba(45,226,255,.14), 0 0 44px rgba(45,226,255,.05);
}
#stage.shake{animation:shk .3s linear;}
@keyframes shk{
  0%{transform:translate(0,0)}20%{transform:translate(-4px,3px)}
  40%{transform:translate(5px,-2px)}60%{transform:translate(-3px,-4px)}
  80%{transform:translate(3px,3px)}100%{transform:translate(0,0)}
}
.tile{position:absolute;padding:0;will-change:background;}
.tile::before{
  content:"";position:absolute;inset:3px;border-radius:10px;
  background:linear-gradient(160deg,#111c2c,#0a121d);
  box-shadow:inset 0 0 0 1px rgba(90,140,190,.13);
  transition:background .12s ease, box-shadow .12s ease;
}
.tile.wall::before{
  background:linear-gradient(160deg,#2a3846,#151e27);
  box-shadow:inset 0 0 0 1px rgba(130,160,180,.20), inset 0 -7px 12px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.4);
}
.tile.wall::after{
  content:"";position:absolute;inset:3px;border-radius:10px;
  background:repeating-linear-gradient(45deg, rgba(255,255,255,.055) 0 2px, rgba(255,255,255,0) 2px 9px);
}
.tile.blast::before{
  background:linear-gradient(160deg, rgba(255,96,60,.34), rgba(255,60,40,.16));
  box-shadow:inset 0 0 0 1px rgba(255,130,90,.6), 0 0 18px rgba(255,80,50,.22);
}
.tile.onpath::before{
  background:linear-gradient(160deg, rgba(45,226,255,.20), rgba(45,226,255,.05));
  box-shadow:inset 0 0 0 1px rgba(45,226,255,.42);
}
.tile.tip::before{
  box-shadow:inset 0 0 0 2px var(--cyan), 0 0 18px rgba(45,226,255,.5);
}
.tile.tip.danger::before{
  box-shadow:inset 0 0 0 2px var(--red), 0 0 18px rgba(255,77,94,.55);
}
.tile.boom::before{
  background:linear-gradient(160deg,#fff6d8,#ffb02e) !important;
  box-shadow:0 0 26px 6px rgba(255,176,46,.75) !important;
  animation:boomPulse .3s ease-out;
}
@keyframes boomPulse{0%{transform:scale(.6);opacity:.2;}40%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
.tile.scorch::before{background:linear-gradient(160deg,#1c1410,#0c0a08);box-shadow:inset 0 0 0 1px rgba(120,60,30,.25);}

.drum{
  position:absolute;inset:16%;border-radius:8px 8px 6px 6px;
  background:linear-gradient(180deg,#ff8f3a 0%,#d04a1c 45%,#8f2c10 100%);
  box-shadow:inset 0 0 0 2px rgba(255,190,120,.35), 0 0 14px rgba(255,120,50,.45);
  animation:drumPulse 1.6s ease-in-out infinite;
}
.drum::before{content:"";position:absolute;left:6%;right:6%;top:22%;height:10%;background:rgba(20,8,4,.55);border-radius:2px;}
.drum::after{content:"";position:absolute;left:6%;right:6%;bottom:22%;height:10%;background:rgba(20,8,4,.55);border-radius:2px;}
@keyframes drumPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.25)}}

/* ---------- layers ---------- */
#tiles,#intents,#pathL,#marks,#bombs,#ents,#fx{position:absolute;inset:0;}
#intents,#pathL,#marks,#bombs,#ents{pointer-events:none;}
#fx{position:absolute;inset:0;pointer-events:none;}

/* intent numbers */
.imark{
  position:absolute;transform:translate(-50%,-50%);
  width:calc(var(--tile)*.30);height:calc(var(--tile)*.30);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--tile)*.19);font-weight:900;line-height:1;
  color:#fff;background:rgba(255,77,94,.72);
  box-shadow:0 0 10px rgba(255,77,94,.5), inset 0 0 0 1px rgba(255,255,255,.28);
  opacity:.92;
}
.imark.t-chaser{background:rgba(200,107,255,.72);box-shadow:0 0 10px rgba(200,107,255,.5), inset 0 0 0 1px rgba(255,255,255,.28);}
.imark.t-dasher{background:rgba(255,138,61,.72);box-shadow:0 0 10px rgba(255,138,61,.5), inset 0 0 0 1px rgba(255,255,255,.28);}
.imark.aimed{background:rgba(255,255,255,.9);color:#a4000f;animation:aimPulse .9s ease-in-out infinite;}
@keyframes aimPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,94,.6)}50%{box-shadow:0 0 0 7px rgba(255,77,94,0)}}

/* player path numbers */
.pmark{
  position:absolute;transform:translate(-50%,-50%);
  width:calc(var(--tile)*.34);height:calc(var(--tile)*.34);border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--tile)*.2);font-weight:900;line-height:1;
  color:#03141b;background:var(--cyan);
  box-shadow:0 0 12px rgba(45,226,255,.65);
  animation:pop .18s ease-out;
}
@keyframes pop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}100%{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* kill markers */
.kmark{
  position:absolute;transform:translate(-50%,-50%);
  font-size:calc(var(--tile)*.34);line-height:1;color:#ffd9dc;
  text-shadow:0 0 10px rgba(255,77,94,.9);
  animation:aimPulse .9s ease-in-out infinite;
}

/* ---------- entities ---------- */
.ent{
  position:absolute;left:0;top:0;width:var(--tile);height:var(--tile);
  transition:left .17s cubic-bezier(.3,.9,.3,1), top .17s cubic-bezier(.3,.9,.3,1), opacity .2s;
  display:flex;align-items:center;justify-content:center;padding:calc(var(--tile) * 0.10);z-index:4;
  will-change:left,top;
}
.ent .shape{
  position:relative;width:100%;height:100%;
  display:flex;align-items:center;justify-content:center;gap:20%;
  transition:transform .17s;
}
.ent .shape i{
  width:16%;height:16%;border-radius:50%;background:#0a0f16;
  box-shadow:0 0 0 1px rgba(255,255,255,.35);
}
.t-player .shape{
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #b6f6ff 0%, #35d9ff 38%, #0a90c8 78%, #055670 100%);
  box-shadow:0 0 16px rgba(45,226,255,.75), inset 0 0 10px rgba(255,255,255,.35);
}
.t-player .shape i{width:20%;height:20%;background:#03222c;box-shadow:none;}
.t-player{filter:drop-shadow(0 2px 4px rgba(0,0,0,.6));}
.t-walker .shape{
  border-radius:26%;
  background:linear-gradient(160deg,#ff7a7f,#e02a3d 60%,#9d0f22);
  box-shadow:0 0 14px rgba(255,77,94,.6), inset 0 0 0 1px rgba(255,200,200,.35);
}
.t-chaser .shape{
  clip-path:polygon(50% 0%,100% 50%,50% 100%,0% 50%);
  background:linear-gradient(160deg,#e2a6ff,#a53cf0 60%,#6a12a8);
  box-shadow:0 0 16px rgba(200,107,255,.6);
  padding:0;
}
.t-chaser .shape i{width:11%;height:11%;margin:0 6%;}
.t-dasher .shape{
  clip-path:polygon(6% 14%,62% 14%,62% 0%,100% 50%,62% 100%,62% 86%,6% 86%);
  background:linear-gradient(160deg,#ffcf8a,#ff8a3d 55%,#c94d0d);
  box-shadow:0 0 16px rgba(255,138,61,.6);
}
.t-dasher .shape i{display:none;}
.ent.dying{animation:die .3s ease-out forwards;}
@keyframes die{0%{transform:scale(1);opacity:1}40%{transform:scale(1.35);opacity:1;filter:brightness(2.2)}100%{transform:scale(.2);opacity:0}}
.ent.spawn{animation:spawnIn .3s ease-out;}
@keyframes spawnIn{0%{transform:scale(.2);opacity:0}100%{transform:scale(1);opacity:1}}
.ent.hit{animation:hitShake .25s;}
@keyframes hitShake{0%,100%{transform:translate(0)}25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}

/* bombs */
.bomb{
  position:absolute;display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--tile)*.52);line-height:1;z-index:3;
  transform:translate(0,0);
  animation:bombIn .2s ease-out;
  filter:drop-shadow(0 0 10px rgba(255,176,46,.8));
}
@keyframes bombIn{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.bomb::after{
  content:"";position:absolute;inset:16%;border-radius:50%;
  border:2px solid rgba(255,176,46,.5);animation:bombRing 1.1s ease-out infinite;
}
@keyframes bombRing{0%{transform:scale(.7);opacity:.9}100%{transform:scale(1.35);opacity:0}}

/* particles */
.pt{
  position:absolute;width:7px;height:7px;border-radius:2px;
  animation:fly .55s ease-out forwards;
}
@keyframes fly{0%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.25);opacity:0}}

/* ---------- controls ---------- */
#controls{position:relative;z-index:2;padding-top:8px;}
#tips{min-height:17px;font-size:12px;font-weight:600;letter-spacing:.01em;text-align:center;color:var(--dim);margin-bottom:8px;}
#tips .warn{color:#ff8a7a;text-shadow:0 0 12px rgba(255,77,94,.4);}
#tips .good{color:#8ef0c0;text-shadow:0 0 12px rgba(80,240,170,.35);}
#tips .info{color:#9fd9ff;}
.btnrow{display:flex;gap:8px;margin-bottom:8px;}
.btnrow2{display:flex;gap:8px;}
.btn{
  -webkit-appearance:none;appearance:none;border:0;font:inherit;color:var(--txt);
  border-radius:14px;padding:0;display:flex;align-items:center;justify-content:center;
  background:#101a28;box-shadow:inset 0 0 0 1px #22334a;cursor:pointer;
  transition:transform .08s ease, filter .12s ease;touch-action:manipulation;
}
.btn:active{transform:scale(.97);}
.btn:disabled{opacity:.38;}
.btn.small{height:34px;font-size:12px;font-weight:700;color:#9db2ca;flex:1;gap:5px;letter-spacing:.02em;}
.btn.icon{flex:0 0 44px;height:34px;font-size:15px;}
.btn.bomb{
  flex:0 0 34%;height:58px;gap:6px;font-size:15px;font-weight:800;
  background:linear-gradient(160deg,#2a1f11,#17110a);
  box-shadow:inset 0 0 0 1.5px rgba(255,176,46,.55), 0 6px 18px rgba(0,0,0,.35);
  color:#ffd88a;
}
.btn.bomb .cnt{
  font-size:12px;font-weight:900;background:var(--amber);color:#1a1004;
  min-width:18px;height:18px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;padding:0 4px;
}
.btn.go{
  flex:1;height:58px;font-size:20px;font-weight:900;letter-spacing:.04em;color:#1a1004;
  background:linear-gradient(160deg,#ffd98a,#ffb02e 45%,#ff8a3d);
  box-shadow:0 8px 24px rgba(255,150,40,.32), inset 0 1px 0 rgba(255,255,255,.55);
}
.btn.go.ready{animation:readyPulse 1.4s ease-in-out infinite;}
@keyframes readyPulse{0%,100%{box-shadow:0 8px 24px rgba(255,150,40,.32), inset 0 1px 0 rgba(255,255,255,.55)}50%{box-shadow:0 8px 30px rgba(255,180,60,.7), inset 0 1px 0 rgba(255,255,255,.75)}}
.btn.go:disabled{animation:none;}

/* ---------- overlays ---------- */
#overlay{
  position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:22px;
  background:rgba(4,6,11,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  transition:opacity .2s;
}
#overlay.hidden{display:none;}
.card{
  width:min(380px,100%);border-radius:22px;padding:24px 20px 20px;position:relative;
  background:linear-gradient(170deg,#0e1826 0%,#080d15 100%);
  box-shadow:0 0 0 1px #223650, 0 24px 70px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.05);
  animation:cardIn .28s ease-out;
  text-align:center;
}
@keyframes cardIn{0%{transform:scale(.92) translateY(10px);opacity:0}100%{transform:scale(1) translateY(0);opacity:1}}
.card .tag{font-size:9px;letter-spacing:.3em;color:var(--cyan);font-weight:800;margin-bottom:8px;}
.card h1{
  margin:0;font-size:34px;line-height:1;letter-spacing:-.02em;font-weight:900;
  background:linear-gradient(180deg,#fff,#8fdcff 60%,#2de2ff);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 18px rgba(45,226,255,.4));
}
.card .subtitle{font-size:12px;letter-spacing:.34em;color:#7b8ea8;font-weight:700;margin:7px 0 16px;}
.rules{list-style:none;margin:0 0 18px;padding:0;text-align:left;display:flex;flex-direction:column;gap:9px;}
.rules li{display:flex;gap:10px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:#b9c9dd;}
.rules li b{display:block;color:#e9f2ff;font-size:13px;margin-bottom:1px;}
.rules li .n{
  flex:0 0 20px;height:20px;border-radius:6px;background:rgba(45,226,255,.14);
  color:var(--cyan);font-weight:900;font-size:11px;display:flex;align-items:center;justify-content:center;
  box-shadow:inset 0 0 0 1px rgba(45,226,255,.3);
}
.btn.play{width:100%;height:56px;font-size:18px;font-weight:900;color:#1a1004;
  background:linear-gradient(160deg,#ffd98a,#ffb02e 45%,#ff8a3d);
  box-shadow:0 10px 28px rgba(255,150,40,.35), inset 0 1px 0 rgba(255,255,255,.6);
  letter-spacing:.04em;
}
.card .note{margin-top:12px;font-size:10.5px;color:#5d708a;letter-spacing:.02em;}
.goover .big{font-size:52px;font-weight:900;color:var(--red);text-shadow:0 0 30px rgba(255,77,94,.6);margin:4px 0 2px;}
.statline{display:flex;justify-content:center;gap:22px;margin:14px 0 18px;}
.statline div{display:flex;flex-direction:column;gap:3px;}
.statline span{font-size:9px;letter-spacing:.2em;color:#6d8199;font-weight:800;}
.statline b{font-size:20px;font-weight:900;color:#e9f2ff;font-variant-numeric:tabular-nums;}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div class="hb"><span class="k">WAVE</span><span class="v wave" id="waveV">1</span></div>
    <div class="hb mid">
      <div class="hearts" id="hearts"></div>
      <div class="sub" id="subV">TURN 1 · 적 2</div>
    </div>
    <div class="hb right"><span class="k">SCORE</span><span class="v score" id="scoreV">0</span></div>
  </header>

  <div id="stage">
    <div id="board">
      <div id="tiles"></div>
      <div id="intents"></div>
      <div id="pathL"></div>
      <div id="marks"></div>
      <div id="bombs"></div>
      <div id="ents"></div>
      <div id="fx"></div>
    </div>
  </div>

  <div id="controls">
    <div id="tips">&nbsp;</div>
    <div class="btnrow">
      <button class="btn icon" id="muteBtn" aria-label="소리 켜기/끄기">🔊</button>
      <button class="btn small" id="undoBtn">↶ 되돌리기</button>
      <button class="btn small" id="resetBtn">⟲ 초기화</button>
    </div>
    <div class="btnrow2">
      <button class="btn bomb" id="bombBtn">💣 폭탄 <span class="cnt" id="bombCnt">2</span></button>
      <button class="btn go" id="goBtn">실행 GO!</button>
    </div>
  </div>
</div>

<div id="overlay">
  <div class="card" id="card"></div>
</div>

<script>
'use strict';

/* =========================================================
   GRID BOMB · 그리드 봄 택틱스
   적의 예고 → 3칸 이동 + 폭탄 설치 → 동시 실행
   ========================================================= */

var N = 6;              // 6x6 그리드
var MAX_STEPS = 3;      // 턴당 이동 칸 수
var MAX_HP = 3;
var BOMBS_PER_TURN = 2;
var STEP_MS = 175;      // 한 칸 이동 애니메이션

var DIRS = [[-1,0],[1,0],[0,-1],[0,1]];

var $ = function(id){ return document.getElementById(id); };
var el = {
  app: $('app'), stage: $('stage'), board: $('board'),
  tiles: $('tiles'), intents: $('intents'), pathL: $('pathL'),
  marks: $('marks'), bombs: $('bombs'), ents: $('ents'), fx: $('fx'),
  waveV: $('waveV'), hearts: $('hearts'), subV: $('subV'), scoreV: $('scoreV'),
  tips: $('tips'), undoBtn: $('undoBtn'), resetBtn: $('resetBtn'),
  bombBtn: $('bombBtn'), bombCnt: $('bombCnt'), goBtn: $('goBtn'),
  muteBtn: $('muteBtn'), overlay: $('overlay'), card: $('card')
};

var T = 56;             // 타일 한 칸 픽셀
var S = null;           // 게임 상태
var tileEls = [];       // [r][c] DOM
var entEls = new Map(); // enemy id -> DOM
var playerEl = null;
var flashCells = new Set(); // 폭발 순간 타일
var toastTimer = null;
var toastMsg = '';

function key(r,c){ return r + ',' + c; }
function inside(r,c){ return r >= 0 && r < N && c >= 0 && c < N; }
function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function sign(v){ return v > 0 ? 1 : (v < 0 ? -1 : 0); }

/* ---------------- 사운드 ---------------- */
var sfx = (function(){
  var ctx = null, muted = false;
  function ac(){
    if (!ctx){
      try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){ ctx = null; }
    }
    if (ctx && ctx.state === 'suspended') { try { ctx.resume(); } catch(e){} }
    return ctx;
  }
  function tone(f1, f2, dur, type, vol){
    if (muted) return;
    var c = ac(); if (!c) return;
    try {
      var t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(f1, t);
      if (f2 && f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(20, f2), t + dur);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(vol, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t); o.stop(t + dur + 0.03);
    } catch(e){}
  }
  function noise(dur, vol){
    if (muted) return;
    var c = ac(); if (!c) return;
    try {
      var n = Math.floor(c.sampleRate * dur);
      var buf = c.createBuffer(1, n, c.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < n; i++){ d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2); }
      var src = c.createBufferSource(); src.buffer = buf;
      var f = c.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(1600, c.currentTime);
      f.frequency.exponentialRampToValueAtTime(180, c.currentTime + dur);
      var g = c.createGain(); g.gain.value = vol;
      g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + dur);
      src.connect(f); f.connect(g); g.connect(c.destination);
      src.start();
    } catch(e){}
  }
  return {
    unlock: function(){ ac(); },
    toggle: function(){ muted = !muted; return muted; },
    isMuted: function(){ return muted; },
    step:    function(){ tone(560, 520, 0.05, 'triangle', 0.05); },
    plan:    function(){ tone(760, 960, 0.05, 'sine', 0.045); },

/* =========================================================
   웨이브 정의
   e: [type, r, c, dr, dc]   type: w=walker, c=chaser, d=dasher
   ========================================================= */
var WAVES = [
  { // 1 : 첫 턴 — 느린 워커 2 (바로 폭발을 체험)
    e: [['w',3,1,1,0],['w',3,4,1,0]],
    walls: [], barrels: []
  },
  { // 2 : 추격자 등장
    e: [['w',0,0,1,0],['c',0,5],['w',0,3,1,0]],
    walls: [[2,1],[3,4]], barrels: []
  },
  { // 3 : 대셔 + 통폭탄
    e: [['c',0,1],['c',0,4],['d',0,2]],
    walls: [[3,2]], barrels: [[2,5]]
  },
  { // 4 : 벽 미로
    e: [['w',0,0,1,0],['w',0,5,1,0],['d',1,2],['c',0,3]],
    walls: [[2,2],[3,0],[3,5]], barrels: [[2,3]]
  },
  { // 5
    e: [['c',0,0],['c',0,5],['d',0,2],['d',0,3]],
    walls: [[2,1],[2,4],[4,0]], barrels: [[1,2],[4,5]]
  },
  { // 6
    e: [['w',0,2,1,0],['c',1,0],['c',1,5],['d',0,4],['w',0,1,1,0]],
    walls: [[3,1],[3,4],[4,2]], barrels: [[2,2]]
  }
];

function rng(seed){
  var s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return function(){ s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
}

function waveDef(n){
  if (WAVES[n-1]) return WAVES[n-1];
  var rand = rng(n * 7919 + 13);
  var count = Math.min(3 + Math.floor(n / 2), 7);
  var pool = n < 9 ? ['c','w','d','c'] : ['c','d','c','d','w'];
  var used = {};
  var enemies = [];
  var tries = 0;
  while (enemies.length < count && tries++ < 200){
    var r = Math.floor(rand() * 2);
    var c = Math.floor(rand() * N);
    if (used[key(r,c)]) continue;
    if (r === 5 && c === 2) continue;
    used[key(r,c)] = 1;
    var type = pool[Math.floor(rand() * pool.length)];
    enemies.push([type, r, c, 1, 0]);
  }
  var walls = [], barrels = [];
  tries = 0;
  var wallCount = Math.min(2 + Math.floor(n / 3), 5);
  while (walls.length < wallCount && tries++ < 200){
    var wr = 2 + Math.floor(rand() * 3);
    var wc = Math.floor(rand() * N);
    if (used[key(wr,wc)]) continue;
    if (wr === 5 && wc === 2) continue;
    used[key(wr,wc)] = 1; walls.push([wr,wc]);
  }
  tries = 0;
  var barrelCount = Math.min(1 + Math.floor(n / 5), 3);
  while (barrels.length < barrelCount && tries++ < 200){
    var br = 1 + Math.floor(rand() * 4);
    var bc = Math.floor(rand() * N);
    if (used[key(br,bc)]) continue;
    used[key(br,bc)] = 1; barrels.push([br,bc]);
  }
  return { e: enemies, walls: walls, barrels: barrels };
}

function newGame(){
  S = {
    wave: 1, turn: 1, hp: MAX_HP, score: 0, kills: 0,

    phase: 'plan', busy: false, nextEnemyId: 1, turn1Tutorial: true
  };
  startWave(1);
}

function startWave(n){
  var def = waveDef(n);
  S.wave = n;
  S.turn = 1;
  S.path = [];
  S.bombs = [];
  S.bombsLeft = BOMBS_PER_TURN;
  S.phase = 'plan';
  S.enemies = [];
  S.player = { r: 5, c: 2 };

  S.grid = [];
  for (var r = 0; r < N; r++){
    var row = [];
    for (var c = 0; c < N; c++){ row.push({ wall:false, barrel:false, scorch:false }); }
    S.grid.push(row);
  }
  def.walls.forEach(function(w){ S.grid[w[0]][w[1]].wall = true; });
  def.barrels.forEach(function(b){
    if (!S.grid[b[0]][b[1]].wall) S.grid[b[0]][b[1]].barrel = true;
  });

  // 플레이어 시작 칸 확보
  S.grid[5][2].wall = false; S.grid[5][2].barrel = false;

  def.e.forEach(function(d){
    var r = d[1], c = d[2];
    if (!inside(r,c) || S.grid[r][c].wall) return;
    if (r === S.player.r && c === S.player.c) return;
    for (var i = 0; i < S.enemies.length; i++){
      if (S.enemies[i].r === r && S.enemies[i].c === c) return;
    }
    S.enemies.push({
      id: S.nextEnemyId++,
      type: d[0] === 'w' ? 'walker' : (d[0] === 'c' ? 'chaser' : 'dasher'),
      r: r, c: c,
      dir: { dr: d[3] === undefined ? 1 : d[3], dc: d[4] === undefined ? 0 : d[4] },
      intent: []
    });
  });

  clearFx();
  buildBoard();
  layout();
  computeIntents();
  renderAll();
  sfx.unlock();
}

/* =========================================================
   적 의도(예고 경로) 계산
   ========================================================= */
function computeIntents(){
  var claimed = {};
  for (var i = 0; i < S.enemies.length; i++){
    var e = S.enemies[i];
    e.intent = [];
    var path = [];
    if (e.type === 'walker') path = walkerIntent(e, claimed);
    else if (e.type === 'chaser') path = chaserIntent(e, claimed);
    else path = dasherIntent(e, claimed);
    e.intent = path;
    var last = path.length ? path[path.length - 1] : { r: e.r, c: e.c };
    claimed[key(last.r, last.c)] = 1;
    claimed[key(e.r, e.c)] = 1;
  }
}

function enemyBlocked(r, c, self, claimed){
  if (!inside(r, c)) return true;
  if (S.grid[r][c].wall) return true;
  if (S.grid[r][c].barrel) return true;
  if (claimed && claimed[key(r,c)] && !(self && self.r === r && self.c === c)) return true;
  for (var i = 0; i < S.enemies.length; i++){
    var o = S.enemies[i];
    if (o === self) continue;
    if (o.r === r && o.c === c) return true;
  }
  return false;
}

function walkerIntent(e, claimed){
  var dir = e.dir;
  var opts = [dir, { dr: -dir.dr, dc: -dir.dc }];
  for (var i = 0; i < opts.length; i++){
    var nr = e.r + opts[i].dr, nc = e.c + opts[i].dc;
    if (!enemyBlocked(nr, nc, e, claimed)){
      e.dir = { dr: opts[i].dr, dc: opts[i].dc };
      return [{ r: nr, c: nc }];
    }
  }
  return [];
}

function chaserIntent(e, claimed){
  var step = bfsFirstStep(e, S.player, claimed);
  return step ? [step] : [];
}

function bfsFirstStep(from, target, claimed){
  var startK = key(from.r, from.c);
  var queue = [{ r: from.r, c: from.c }];
  var prev = {};
  var seen = {}; seen[startK] = 1;
  var guard = 0;
  while (queue.length && guard++ < 200){
    var cur = queue.shift();
    if (cur.r === target.r && cur.c === target.c){
      var node = cur, path = [cur], g2 = 0;
      while (g2++ < 60){
        var k = key(node.r, node.c);
        if (k === startK) break;
        node = prev[k];
        if (!node) break;
        path.unshift(node);
      }
      return path.length > 1 ? path[1] : null;
    }
    for (var i = 0; i < DIRS.length; i++){
      var nr = cur.r + DIRS[i][0], nc = cur.c + DIRS[i][1];
      var k2 = key(nr, nc);
      if (seen[k2]) continue;
      var isTarget = (nr === target.r && nc === target.c);
      if (!isTarget && enemyBlocked(nr, nc, from, claimed)) continue;
      if (!inside(nr, nc)) continue;
      if (S.grid[nr][nc].wall) continue;
      seen[k2] = 1; prev[k2] = cur;
      queue.push({ r: nr, c: nc });
    }
  }
  return null;
}

function dasherIntent(e, claimed){
  var dr = S.player.r - e.r, dc = S.player.c - e.c;
  var primary, secondary;
  if (Math.abs(dr) >= Math.abs(dc)){
    primary = { dr: sign(dr) || 1, dc: 0 };
    secondary = { dr: 0, dc: sign(dc) || (dc >= 0 ? 1 : -1) };
  } else {
    primary = { dr: 0, dc: sign(dc) || 1 };
    secondary = { dr: sign(dr) || (dr >= 0 ? 1 : -1), dc: 0 };
  }
  var order = [primary, secondary];
  for (var o = 0; o < order.length; o++){
    var d = order[o];
    var path = [];
    var cr = e.r, cc = e.c;
    for (var i = 0; i < 2; i++){
      var nr = cr + d.dr, nc = cc + d.dc;
      if (enemyBlocked(nr, nc, e, claimed)) break;
      if (path.length && claimed[key(nr,nc)]) break;
      path.push({ r: nr, c: nc });
      cr = nr; cc = nc;
    }
    if (path.length) { e.face = d; return path; }
  }
  return [];
}

/* =========================================================
   보드 / 렌더
   ========================================================= */
function layout(){
  var stageRect = el.stage.getBoundingClientRect();
  var w = stageRect.width - 6;
  var h = stageRect.height - 6;
  var size = Math.min(w, h, 460);
  T = Math.max(34, Math.floor(size / N));
  var boardSize = T * N;
  el.board.style.width = boardSize + 'px';
  el.board.style.height = boardSize + 'px';
  document.documentElement.style.setProperty('--tile', T + 'px');
  positionTiles();
  renderAll();
}

function positionTiles(){
  for (var r = 0; r < N; r++){
    for (var c = 0; c < N; c++){
      var d = tileEls[r] && tileEls[r][c];
      if (!d) continue;
      d.style.left = (c * T) + 'px';
      d.style.top = (r * T) + 'px';
      d.style.width = T + 'px';
      d.style.height = T + 'px';
    }
  }
  placePlayer();
  entEls.forEach(function(node, id){
    var e = findEnemy(id);
    if (e) place(node, e.r, e.c);
  });
}

function buildBoard(){
  el.tiles.innerHTML = '';
  tileEls = [];
  for (var r = 0; r < N; r++){
    var row = [];
    for (var c = 0; c < N; c++){
      var d = document.createElement('div');
      d.className = 'tile';
      d.dataset.r = r; d.dataset.c = c;
      if (S.grid[r][c].barrel){
        var dr = document.createElement('div');
        dr.className = 'drum';
        d.appendChild(dr);
      }
      el.tiles.appendChild(d);
      row.push(d);
    }
    tileEls.push(row);
  }
  // 엔티티 초기화
  el.ents.innerHTML = '';
  entEls.clear();
  playerEl = null;
  positionTiles();
}

function place(node, r, c){
  node.style.left = (c * T) + 'px';
  node.style.top = (r * T) + 'px';
  node.style.width = T + 'px';
  node.style.height = T + 'px';
}

function placePlayer(){
  if (playerEl && S) place(playerEl, S.player.r, S.player.c);
}

function cellCenter(r, c){ return { x: (c + 0.5) * T, y: (r + 0.5) * T }; }

function findEnemy(id){
  for (var i = 0; i < S.enemies.length; i++) if (S.enemies[i].id === id) return S.enemies[i];
  return null;
}

function currentTip(){
  return S.path.length ? S.path[S.path.length - 1] : S.player;
}

function bombAt(r, c){
  for (var i = 0; i < S.bombs.length; i++){
    if (S.bombs[i].r === r && S.bombs[i].c === c) return S.bombs[i];
  }
  return null;
}

function blastCells(r, c){
  var out = [{ r: r, c: c }];
  for (var i = 0; i < DIRS.length; i++){
    var nr = r + DIRS[i][0], nc = c + DIRS[i][1];
    if (!inside(nr, nc)) continue;
    if (S.grid[nr][nc].wall) continue;
    out.push({ r: nr, c: nc });
  }
  return out;
}

function blastPreviewSet(){
  var set = new Set();
  for (var i = 0; i < S.bombs.length; i++){
    var cells = blastCells(S.bombs[i].r, S.bombs[i].c);
    for (var j = 0; j < cells.length; j++) set.add(key(cells[j].r, cells[j].c));
  }
  return set;
}

function enemyEndTile(e){
  return e.intent.length ? e.intent[e.intent.length - 1] : { r: e.r, c: e.c };
}

function renderAll(){
  renderTiles();
  renderBombs();
  renderIntents();
  renderPath();
  renderMarks();
  renderEntities();
  renderHud();
  renderTips();
}

function renderTiles(){
  if (!S) return;
  var blast = blastPreviewSet();
  var pathSet = new Set();
  for (var i = 0; i < S.path.length; i++) pathSet.add(key(S.path[i].r, S.path[i].c));
  var tip = currentTip();
  var tipKey = key(tip.r, tip.c);
  var tipDanger = blast.has(tipKey);

  for (var r = 0; r < N; r++){
    for (var c = 0; c < N; c++){
      var node = tileEls[r] && tileEls[r][c];
      if (!node) continue;
      var k = key(r, c);
      var cls = 'tile';
      if (S.grid[r][c].wall) cls += ' wall';
      if (S.grid[r][c].barrel) cls += ' barrel-cell';
      if (S.grid[r][c].scorch) cls += ' scorch';
      if (blast.has(k)) cls += ' blast';
      if (pathSet.has(k)) cls += ' onpath';
      if (flashCells.has(k)) cls += ' boom';
      if (k === tipKey){
        cls += ' tip';
        if (tipDanger) cls += ' danger';
      }
      if (node.className !== cls) node.className = cls;
    }
  }
}

function renderBombs(){
  el.bombs.innerHTML = '';
  for (var i = 0; i < S.bombs.length; i++){
    var b = S.bombs[i];
    var d = document.createElement('div');
    d.className = 'bomb';
    d.textContent = '💣';
    d.style.left = (b.c * T) + 'px';
    d.style.top = (b.r * T) + 'px';
    d.style.width = T + 'px';
    d.style.height = T + 'px';
    el.bombs.appendChild(d);
  }
}

function renderIntents(){
  el.intents.innerHTML = '';
  for (var i = 0; i < S.enemies.length; i++){
    var e = S.enemies[i];
    var colorType = 't-' + e.type;
    for (var j = 0; j < e.intent.length; j++){
      var p = e.intent[j];
      var d = document.createElement('div');
      d.className = 'imark ' + colorType + ((p.r === S.player.r && p.c === S.player.c) ? ' aimed' : '');
      d.textContent = (j + 1);
      var ctr = cellCenter(p.r, p.c);
      d.style.left = ctr.x + 'px';
      d.style.top = ctr.y + 'px';
      el.intents.appendChild(d);
    }
  }

function renderPath(){
  el.pathL.innerHTML = '';
  for (var i = 0; i < S.path.length; i++){
    var p = S.path[i];
    var d = document.createElement('div');
    d.className = 'pmark';
    d.textContent = (i + 1);
    var ctr = cellCenter(p.r, p.c);
    d.style.left = ctr.x + 'px';
    d.style.top = ctr.y + 'px';
    el.pathL.appendChild(d);
  }
}

function renderMarks(){
  el.marks.innerHTML = '';
  var blast = blastPreviewSet();
  if (!blast.size) return;
  for (var i = 0; i < S.enemies.length; i++){
    var e = S.enemies[i];
    var end = enemyEndTile(e);
    if (!blast.has(key(end.r, end.c))) continue;
    var d = document.createElement('div');
    d.className = 'kmark';
    d.textContent = '☠';
    var ctr = cellCenter(end.r, end.c);

    d.style.top = (ctr.y - T * 0.24) + 'px';
    el.marks.appendChild(d);
  }
}

function renderEntities(){
  // player
  if (!playerEl){
    playerEl = document.createElement('div');
    playerEl.className = 'ent t-player';
    playerEl.innerHTML = '<div class="shape"><i></i><i></i></div>';
    el.ents.appendChild(playerEl);
  }
  place(playerEl, S.player.r, S.player.c);
  playerEl.style.opacity = S.phase === 'over' ? '0.35' : '1';

  var alive = new Set();
  for (var i = 0; i < S.enemies.length; i++){
    var e = S.enemies[i];
    alive.add(e.id);
    var node = entEls.get(e.id);
    if (!node){
      node = document.createElement('div');
      node.className = 'ent t-' + e.type + ' spawn';
      node.innerHTML = '<div class="shape"><i></i><i></i></div>';
      el.ents.appendChild(node);
      entEls.set(e.id, node);
    }
    node.className = 'ent t-' + e.type;
    place(node, e.r, e.c);
    if (e.type === 'dasher'){
      var face = e.face || { dr: 1, dc: 0 };
      var deg = 0;
      if (face.dr === 1) deg = 90;
      else if (face.dc === -1) deg = 180;
      else if (face.dr === -1) deg = 270;
      node.querySelector('.shape').style.transform = 'rotate(' + deg + 'deg)';
    }
  }
  entEls.forEach(function(node, id){
    if (!alive.has(id)){ node.remove(); entEls.delete(id); }
  });
}

function renderHud(){
  el.waveV.textContent = S.wave;
  el.scoreV.textContent = S.score;
  var h = '';
  for (var i = 0; i < MAX_HP; i++){
    h += '<span class="' + (i < S.hp ? 'on' : 'off') + '">' + (i < S.hp ? '♥' : '♡') + '</span>';
  }
  if (el.hearts.dataset.sig !== h){
    el.hearts.innerHTML = h;
    el.hearts.dataset.sig = h;
  }
  el.subV.textContent = 'TURN ' + S.turn + ' · 적 ' + S.enemies.length + ' · ☠' + S.kills;
  el.bombCnt.textContent = S.bombsLeft;
  var planning = S.phase === 'plan';
  el.bombBtn.disabled = !planning || S.bombsLeft <= 0;
  el.undoBtn.disabled = !planning || (!S.path.length && !S.bombs.length);
  el.resetBtn.disabled = !planning || (!S.path.length && !S.bombs.length);
  el.goBtn.disabled = !planning;
  el.goBtn.classList.toggle('ready', planning && (S.path.length > 0 || S.bombs.length > 0));
}

function renderTips(){
  var html = '';
  if (toastMsg){
    html = toastMsg;
  } else if (S.phase === 'anim'){
    html = '<span class="info">실행 중…</span>';
  } else if (S.phase === 'over'){
    html = '';
  } else {
    var blast = blastPreviewSet();
    var tip = currentTip();
    var tipInBlast = blast.has(key(tip.r, tip.c));
    var doomed = 0;
    for (var i = 0; i < S.enemies.length; i++){
      var end = enemyEndTile(S.enemies[i]);
      if (blast.has(key(end.r, end.c))) doomed++;
    }
    if (tipInBlast){
      html = '<span class="warn">⚠ 도착 칸이 폭발 범위!</span>';
    } else if (doomed > 0){
      html = '<span class="good">☠ 처치 예정 ' + doomed + '</span> · 남은 폭탄 ' + S.bombsLeft;
    } else if (S.wave === 1 && S.turn <= 2){
      html = '이동 ' + S.path.length + '/3 · 인접 칸을 눌러 경로 · 💣는 끝 칸에';
    } else {
      html = '이동 ' + S.path.length + '/3 · 폭탄 ' + S.bombsLeft;
    }
  }
  el.tips.innerHTML = html || '&nbsp;';
}

function toast(msg){
  toastMsg = msg;
  renderTips();
  if (toastTimer) clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ toastMsg = ''; toastTimer = null; renderTips(); }, 1200);
}

function clearFx(){
  flashCells.clear();
  if (el.fx) el.fx.innerHTML = '';
  if (el.marks) el.marks.innerHTML = '';
}

/* =========================================================
   입력
   ========================================================= */
function playerWalkable(r, c){
  if (!inside(r, c)) return false;
  if (S.grid[r][c].wall || S.grid[r][c].barrel) return false;
  if (bombAt(r, c)) return false;
  return true;
}

function tapCell(r, c){
  if (S.phase !== 'plan' || S.busy) return;

  // 1) 폭탄 회수
  var b = bombAt(r, c);
  if (b){
    S.bombs.splice(S.bombs.indexOf(b), 1);
    S.bombsLeft++;
    sfx.take();
    renderAll();
    return;
  }

  // 2) 경로 되돌리기 (지나온 칸을 누르면 그 지점까지 자름)
  for (var i = 0; i < S.path.length; i++){
    if (S.path[i].r === r && S.path[i].c === c){
      S.path.length = i;
      sfx.unplan();
      renderAll();
      return;
    }
  }

  // 3) 경로 연장
  var tip = currentTip();
  var dist = Math.abs(tip.r - r) + Math.abs(tip.c - c);
  if (dist !== 1){ toast('인접한 칸을 눌러 이동'); return; }
  if (S.path.length >= MAX_STEPS){ toast('이동은 최대 3칸'); return; }
  if (!playerWalkable(r, c)){ toast('지나갈 수 없는 칸'); return; }

  S.path.push({ r: r, c: c });
  sfx.plan();
  haptic(8);
  renderAll();
}

el.board.addEventListener('pointerdown', function(ev){
  if (!S) return;
  ev.preventDefault();
  var rect = el.board.getBoundingClientRect();
  var t = rect.width / N;
  var c = Math.floor((ev.clientX - rect.left) / t);
  var r = Math.floor((ev.clientY - rect.top) / t);
  if (!inside(r, c)) return;
  tapCell(r, c);
});

el.bombBtn.addEventListener('click', function(){
  if (!S || S.phase !== 'plan' || S.bombsLeft <= 0) return;
  var tip = currentTip();
  if (bombAt(tip.r, tip.c)){ toast('이미 폭탄이 있습니다'); return; }
  if (S.grid[tip.r][tip.c].wall || S.grid[tip.r][tip.c].barrel){ toast('여기엔 놓을 수 없습니다'); return; }
  S.bombs.push({ r: tip.r, c: tip.c });
  S.bombsLeft--;
  sfx.bomb();
  haptic(12);
  renderAll();
});

el.undoBtn.addEventListener('click', function(){
  if (!S || S.phase !== 'plan') return;
  if (S.path.length){ S.path.pop(); sfx.unplan(); }
  else if (S.bombs.length){ S.bombs.pop(); S.bombsLeft++; sfx.take(); }
  else return;
  renderAll();
});

el.resetBtn.addEventListener('click', function(){
  if (!S || S.phase !== 'plan') return;
  S.path = [];
  S.bombs = [];
  S.bombsLeft = BOMBS_PER_TURN;
  sfx.unplan();
  renderAll();
});

el.goBtn.addEventListener('click', function(){
  if (!S || S.phase !== 'plan' || S.busy) return;
  executeTurn();
});

el.muteBtn.addEventListener('click', function(){
  var m = sfx.toggle();
  el.muteBtn.textContent = m ? '🔇' : '🔊';
  el.muteBtn.style.opacity = m ? '0.5' : '1';
});

/* =========================================================
   실행
   ========================================================= */
async function executeTurn(){
  S.busy = true;
  S.phase = 'anim';
  toastMsg = '';
  renderHud();
  renderTips();

  var plan = S.path.slice();
  var steps = plan.length;
  for (var i = 0; i < S.enemies.length; i++){
    steps = Math.max(steps, S.enemies[i].intent.length);
  }

  // 동시 이동
  for (var s = 0; s < steps; s++){
    if (s < plan.length){
      S.player = { r: plan[s].r, c: plan[s].c };
      sfx.step();
    }
    for (var e = 0; e < S.enemies.length; e++){
      var en = S.enemies[e];
      if (en.intent[s]){ en.r = en.intent[s].r; en.c = en.intent[s].c; }
    }
    renderEntities();
    renderTips();
    await sleep(STEP_MS);

    var collided = checkCollisions();
    if (collided) await sleep(120);
    if (S.hp <= 0) break;
  }

  // 폭발
  if (S.hp > 0 && S.bombs.length){
    await detonateSequence();
  }
  if (S.hp <= 0){ gameOver(); return; }

  S.bombs = [];
  S.bombsLeft = BOMBS_PER_TURN;
  S.path = [];
  renderAll();

  // 웨이브 클리어?
  if (S.enemies.length === 0){
    await waveClear();
    return;
  }

  nextTurn();
}

function checkCollisions(){
  var hit = false;
  var list = S.enemies.slice();
  for (var i = 0; i < list.length; i++){
    var e = list[i];
    if (e.r === S.player.r && e.c === S.player.c){
      killEnemy(e, 60, false);
      damagePlayer(1);
      hit = true;
    }
  }
  return hit;
}

async function detonateSequence(){
  var first = [];
  for (var i = 0; i < S.bombs.length; i++) first.push({ r: S.bombs[i].r, c: S.bombs[i].c });
  S.bombs = [];
  renderBombs();
  renderAll();
  if (!first.length) return;

  var done = new Set();
  var hurtThisTurn = false;
  var wave = first;
  var guard = 0;

  while (wave.length && guard++ < 24){
    var cells = [];
    for (var w = 0; w < wave.length; w++){
      var bc = blastCells(wave[w].r, wave[w].c);
      for (var j = 0; j < bc.length; j++){
        var k = key(bc[j].r, bc[j].c);
        if (done.has(k)) continue;
        done.add(k);
        cells.push(bc[j]);
      }
    }
    if (!cells.length) break;

    // 폭발 연출
    for (var m = 0; m < cells.length; m++){
      flashCells.add(key(cells[m].r, cells[m].c));
      burst(cells[m].r, cells[m].c, '#ffb02e', 4);
    }
    renderTiles();
    shake(7);
    sfx.boom();
    haptic(30);
    (function(cs){
      setTimeout(function(){
        for (var q = 0; q < cs.length; q++) flashCells.delete(key(cs[q].r, cs[q].c));
        renderAll();
      }, 320);
    })(cells.slice());

    await sleep(75);

    // 피해 + 연쇄
    var next = [];
    for (var c2 = 0; c2 < cells.length; c2++){
      var cr = cells[c2].r, cc = cells[c2].c;
      var targets = S.enemies.slice();
      for (var t2 = 0; t2 < targets.length; t2++){
        if (targets[t2].r === cr && targets[t2].c === cc) killEnemy(targets[t2], 120, true);
      }
      if (!hurtThisTurn && S.player.r === cr && S.player.c === cc){
        hurtThisTurn = true;
        damagePlayer(1);
      }
      var g = S.grid[cr][cc];
      if (g.barrel){
        g.barrel = false;
        g.scorch = true;
        if (tileEls[cr] && tileEls[cr][cc]) tileEls[cr][cc].innerHTML = '';
        burst(cr, cc, '#ff8a3d', 10);
        next.push({ r: cr, c: cc });
        sfx.barrel();
      }
    }
    renderAll();
    wave = next;
    if (wave.length) await sleep(110);
  }
}

function damagePlayer(n){
  S.hp = Math.max(0, S.hp - n);
  sfx.hurt();
  haptic(45);
  shake(9);
  var v = document.createElement('div');
  v.style.cssText = 'position:fixed;inset:0;pointer-events:none;z-index:30;background:radial-gradient(circle, rgba(255,40,60,0) 40%, rgba(255,30,50,.45) 100%);';
  document.body.appendChild(v);
  setTimeout(function(){ v.style.transition = 'opacity .3s'; v.style.opacity = '0'; }, 90);
  setTimeout(function(){ v.remove(); }, 420);
  if (playerEl){
    playerEl.classList.add('hit');
    setTimeout(function(){ if (playerEl) playerEl.classList.remove('hit'); }, 260);
  }
  renderHud();
}

function killEnemy(e, points, showScore){
  var idx = S.enemies.indexOf(e);
  if (idx < 0) return;
  S.enemies.splice(idx, 1);
  S.kills++;
  if (showScore !== false) S.score += points || 100;
  else S.score += points || 60;

  var node = entEls.get(e.id);
  if (node){
    node.classList.add('dying');
    (function(n){ setTimeout(function(){ if (n && n.parentNode) n.remove(); }, 320); })(node);
    entEls.delete(e.id);
  }
  burst(e.r, e.c, e.type === 'chaser' ? '#c86bff' : (e.type === 'dasher' ? '#ff8a3d' : '#ff4d5e'), 10);
  sfx.kill();
  haptic(18);
  renderHud();
  renderEntities();
}

function burst(r, c, color, count){
  if (!S) return;
  var ctr = cellCenter(r, c);
  for (var i = 0; i < count; i++){
    var p = document.createElement('div');
    p.className = 'pt';
    var ang = Math.random() * Math.PI * 2;
    var dist = T * (0.25 + Math.random() * 0.55);
    p.style.left = (ctr.x - 3) + 'px';
    p.style.top = (ctr.y - 3) + 'px';
    p.style.background = color;
    p.style.setProperty('--dx', (Math.cos(ang) * dist).toFixed(1) + 'px');
    p.style.setProperty('--dy', (Math.sin(ang) * dist).toFixed(1) + 'px');
    el.fx.appendChild(p);
    (function(node){ setTimeout(function(){ if (node.parentNode) node.remove(); }, 600); })(p);
  }
}

function shake(px){
  el.stage.classList.remove('shake');
  void el.stage.offsetWidth;
  el.stage.classList.add('shake');
  setTimeout(function(){ el.stage.classList.remove('shake'); }, 320);
}

function nextTurn(){
  S.turn++;
  S.path = [];
  S.bombs = [];
  S.bombsLeft = BOMBS_PER_TURN;
  S.phase = 'plan';
  S.busy = false;
  computeIntents();
  renderAll();
}

async function waveClear(){
  S.busy = true;
  var bonus = 150 * S.wave;
  S.score += bonus;
  renderHud();
  sfx.clear();
  sfx.unlock();
  showWaveBanner('WAVE ' + S.wave + ' CLEAR', '+' + bonus);
  await sleep(1250);
  var nextWave = S.wave + 1;
  S.hp = Math.min(MAX_HP, S.hp + 1);
  S.busy = false;
  startWave(nextWave);
  hideOverlay();
}

function showWaveBanner(title, sub){
  var d = document.createElement('div');
  d.style.cssText = 'position:fixed;left:0;right:0;top:38%;z-index:35;text-align:center;pointer-events:none;';
  d.innerHTML =
    '<div style="font-size:12px;letter-spacing:.4em;color:#7b8ea8;font-weight:800;margin-bottom:8px;">CLEAR</div>' +
    '<div style="font-size:34px;font-weight:900;letter-spacing:.02em;color:#8ef0c0;text-shadow:0 0 30px rgba(80,240,170,.55);">' + title + '</div>' +
    '<div style="font-size:16px;font-weight:800;color:#ffb02e;margin-top:6px;">' + (sub || '') + '</div>';
  d.animate ? d.animate([{ opacity: 0, transform: 'scale(.85)' }, { opacity: 1, transform: 'scale(1)' }], { duration: 260, fill: 'both' }) : null;
  document.body.appendChild(d);
  setTimeout(function(){
    d.style.transition = 'opacity .35s';
    d.style.opacity = '0';
    setTimeout(function(){ d.remove(); }, 400);
  }, 950);
}

function gameOver(){
  S.phase = 'over';
  S.busy = true;
  renderAll();
  sfx.over();
  var best = 0;
  try { best = parseInt(localStorage.getItem('gridbomb_best') || '0', 10) || 0; } catch(e){}
  if (S.score > best){ best = S.score; try { localStorage.setItem('gridbomb_best', String(best)); } catch(e){} }
  el.card.className = 'card goover';
  el.card.innerHTML =
    '<div class="tag">GAME OVER</div>' +
    '<div class="big">✖</div>' +
    '<div style="font-size:14px;color:#b9c9dd;font-weight:700;margin-top:6px;">WAVE ' + S.wave + '에서 쓰러졌다</div>' +
    '<div class="statline">' +
      '<div><span>SCORE</span><b>' + S.score + '</b></div>' +
      '<div><span>KILLS</span><b>' + S.kills + '</b></div>' +
      '<div><span>BEST</span><b>' + best + '</b></div>' +
    '</div>' +
    '<button class="btn play" data-act="restart">다시 도전</button>' +
    '<div class="note">적의 예고를 끝까지 읽고, 폭발 범위 밖에서 끝내세요.</div>';
  el.overlay.classList.remove('hidden');
}

function showOverlay(html, cls){
  el.card.className = 'card' + (cls ? ' ' + cls : '');
  el.card.innerHTML = html;
  el.overlay.classList.remove('hidden');
}
function hideOverlay(){ el.overlay.classList.add('hidden'); }

el.overlay.addEventListener('click', function(ev){
  var btn = ev.target.closest('[data-act]');
  if (!btn) return;
  var act = btn.getAttribute('data-act');
  sfx.unlock();
  if (act === 'start'){
    hideOverlay();
    newGame();
  } else if (act === 'restart'){
    hideOverlay();
    newGame();
  } else if (act === 'rules'){
    showIntro();
  }
});

function showIntro(){
  showOverlay(
    '<div class="tag">TACTICAL PUZZLE ACTION</div>' +
    '<h1>GRID BOMB</h1>' +
    '<div class="subtitle">그리드 봄 택틱스</div>' +
    '<ol class="rules">' +
      '<li><span class="n">1</span><div><b>적의 예고를 읽는다</b>숫자는 이번 턴 적이 밟을 칸입니다. 다 보여줍니다.</div></li>' +
      '<li><span class="n">2</span><div><b>3칸 이동 + 폭탄</b>칸을 눌러 경로를 긋고, 💣는 경로 끝에 놓습니다. 폭발 범위가 미리 보입니다.</div></li>' +
      '<li><span class="n">3</span><div><b>실행 GO!</b>모두 동시에 움직이고 폭탄이 터집니다. 도착 칸이 범위 밖인지 확인!</div></li>' +
    '</ol>' +
    '<button class="btn play" data-act="start">플레이</button>' +
    '<div class="note">폭탄에 맞은 적은 파괴 · 몸으로 부딪히면 체력 1 감소</div>'
  );
}

/* =========================================================
   부트
   ========================================================= */
window.addEventListener('resize', function(){ if (S) layout(); });
window.addEventListener('orientationchange', function(){ setTimeout(function(){ if (S) layout(); }, 220); });
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });
document.addEventListener('dblclick', function(e){ e.preventDefault(); }, { passive: false });

newGame();
showIntro();
</script>
