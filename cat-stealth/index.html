<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a1410">
<title>TINY &amp; PAWS · 작은 인간과 거대 고양이</title>
<link rel="preload" as="image" href="assets/start-bg.png">
<link rel="preload" as="image" href="assets/start-title.png">
<link rel="preload" as="image" href="assets/game-bg.jpg?v=20261127k">
<link rel="preload" as="font" type="font/woff2" href="assets/fonts/Galmuri11-Bold.woff2" crossorigin>
<link rel="stylesheet" href="css/style.css?v=20261127k">
<link rel="stylesheet" href="css/start.css?v=20261127k">
<link rel="stylesheet" href="css/clearwin.css?v=20261127k">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hb"><div class="k">STAGE</div><div class="srow"><button class="snav" id="sPrev" aria-label="이전 스테이지">‹</button><div class="v stage" id="hStage">1-5</div><button class="snav" id="sNext" aria-label="다음 스테이지">›</button></div></div>
    <div class="hb mid"><div id="hName">부엌 코너</div></div>
    <div class="hb right"><div class="k">TURN</div><div class="v turnnum" id="hTurn">1</div></div>
  </div>
  <div id="stage">
    <div id="boardWrap"><canvas id="cv" width="360" height="360"></canvas></div>
    <div id="warn"></div>
    <div id="stam" class="hidden"></div>
  </div>
  <div id="controls">
    <div id="topControls">
      <div id="dpad">
        <button class="dk up" data-dir="0" aria-label="위로 이동">▲</button>
        <button id="bWait" class="hidden" aria-label="조준한 곳에 먹이 투척"><span class="ic">🎯</span><span class="tx">투척</span></button>
        <button class="dk left" data-dir="3" aria-label="왼쪽으로 이동">◀</button>
        <button class="dk down" data-dir="2" aria-label="아래로 이동">▼</button>
        <button class="dk right" data-dir="1" aria-label="오른쪽으로 이동">▶</button>
      </div>
      <div id="btnrow">
        <button id="bUndo" aria-label="취소 — 한 수 되돌리기"><span class="ic"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.5 4 4.5 9l5 5"/><path d="M4.5 9h9.5a5.5 5.5 0 0 1 0 11"/></svg></span><span class="kc">U</span></button>
        <button id="bReset" aria-label="리셋 — 스테이지 처음부터"><span class="ic">↻</span><span class="kc">R</span></button>
      </div>
    </div>
    <div id="invbar" aria-label="인벤토리 · 주운 먹이만 들어와요">
      <button class="slot empty" data-slot="0" aria-label="빈 인벤토리 슬롯 1"><span class="kc">1</span><span class="n"></span><span class="em"></span><span class="nm"></span></button>
      <button class="slot empty" data-slot="1" aria-label="빈 인벤토리 슬롯 2"><span class="kc">2</span><span class="n"></span><span class="em"></span><span class="nm"></span></button>
      <button class="slot empty" data-slot="2" aria-label="빈 인벤토리 슬롯 3"><span class="kc">3</span><span class="n"></span><span class="em"></span><span class="nm"></span></button>
      <button class="slot empty" data-slot="3" aria-label="빈 인벤토리 슬롯 4"><span class="kc">4</span><span class="n"></span><span class="em"></span><span class="nm"></span></button>
      <button class="slot empty" data-slot="4" aria-label="빈 인벤토리 슬롯 5"><span class="kc">5</span><span class="n"></span><span class="em"></span><span class="nm"></span></button>
    </div>
    <div id="hint">바닥의 먹이를 밟으면 주워요 · 보라 점선(기척) 안에 서면 들켜요</div>
  </div>
  <div id="itemTip" class="hidden" role="dialog" aria-modal="true" aria-label="아이템 상세 정보">
    <div class="tipcard" id="tipCard">
      <button class="tipx" id="tipX" aria-label="닫기">✕</button>
      <div class="thead">
        <span class="tem" id="tipEm">🐟</span>
        <div class="tmeta"><b id="tipNm">작은 생선</b>
          <div class="tsub"><span class="ttag" id="tipTag">짧은 유인</span><span class="tqty" id="tipQty">보유 1개</span></div>
        </div>
      </div>
      <div class="tbody" id="tipBody"></div>
    </div>
  </div>
  <div id="overlay" class="hidden"><canvas id="cfx" aria-hidden="true"></canvas><div class="panel" id="panel"></div></div>
</div>
<!-- ================= 스타트 화면 (풀스크린 인트로) ================= -->
<div id="start" role="dialog" aria-label="TINY &amp; PAWS 시작 화면">
  <div class="st-cam" id="stCam">
    <div class="st-world" id="stWorld">
      <img class="st-bg" src="assets/start-bg.png" alt="" draggable="false">
      <div class="st-ch a" id="chA"><img src="assets/start-cat-a.png" alt="회색 고양이" draggable="false"></div>
      <div class="st-ch b" id="chB"><img src="assets/start-cat-b.png" alt="주황 치즈태비 고양이" draggable="false"></div>
      <div class="st-ch c" id="chC"><img src="assets/start-cat-c.png" alt="검정 턱시도 고양이" draggable="false"></div>
      <div class="st-fg fg1"></div>
      <div class="st-ch h" id="chH"><img src="assets/start-human.png" alt="작은 인간" draggable="false"></div>
      <div class="st-fg fg2"></div>
      <div class="st-light"></div>
    </div>
  </div>
  <div class="st-motes" id="stMotes"></div>
  <div class="st-ui" id="stUi">
    <div class="st-twrap" id="stTitleWrap">
      <img id="stTitle" src="assets/start-title.png" alt="TINY &amp; PAWS" draggable="false">
      <div class="st-sub">— 작은 인간과 거대 고양이 —</div>
    </div>
    <div class="st-btns" id="stBtns">
      <button class="st-btn" id="stStart" type="button">시작하기<span class="st-kc">Enter</span></button>
      <button class="st-btn" id="stOpts" type="button">+ 옵션 +</button>
    </div>
  </div>
  <div class="st-skip" id="stSkip">탭하면 건너뛰기</div>
  <div class="st-panel-wrap hidden" id="stOptPanel">
    <div class="st-panel">
      <div class="st-ptitle">+ 옵션 +</div>
      <div class="st-prow"><span>효과음</span>
        <button class="st-sw" id="stSfx" type="button" role="switch" aria-checked="true" aria-label="효과음 켜기/끄기"><i></i></button>
      </div>
      <div class="st-plabel">스테이지</div>
      <div class="st-grid" id="stGrid"></div>
      <button class="st-pclose" id="stPClose" type="button">닫기</button>
    </div>
  </div>
</div>

<script src="js/data.js?v=20261127k"></script>
<script src="js/model.js?v=20261127k"></script>
<script src="js/editor-model.js?v=20261127k"></script>
<script src="js/assets.js?v=20261127k"></script>
<script src="js/view.js?v=20261127k"></script>
<script src="js/audio.js?v=20261127k"></script>
<script src="js/playtest.js?v=20261127k"></script>
<script src="js/clearwin.js?v=20261127k"></script>
<script src="js/controller.js?v=20261127k"></script>
<script src="js/start.js?v=20261127k"></script>
</body>
</html>
