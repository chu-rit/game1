<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#141019">
<title>TINY &amp; PAWS · 작은 인간과 거대 고양이</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="hb"><div class="k">STAGE</div><div class="v stage" id="hStage">1-5</div></div>
    <div class="hb mid"><div id="hName">부엌 코너</div></div>
    <div class="hb right"><div class="k">TURN</div><div class="v turnnum" id="hTurn">1</div></div>
  </div>
  <div id="stage">
    <div id="boardWrap"><canvas id="cv" width="360" height="360"></canvas></div>
    <div id="warn"></div>
  </div>
  <div id="controls">
    <div id="btnrow">
      <button id="bUndo">↩ 취소 <span class="kc">U</span></button>
      <button id="bReset">↻ 리셋 <span class="kc">R</span></button>
    </div>
    <div id="fishbar">
      <button class="fb" data-kind="small" aria-label="작은 생선"><span class="kc">1</span>🐟<span class="nm">작은생선</span><span class="n">0</span></button>
      <button class="fb" data-kind="big" aria-label="큰 통생선"><span class="kc">2</span>🐠<span class="nm">통생선</span><span class="n">0</span></button>
      <button class="fb" data-kind="catnip" aria-label="캣닢"><span class="kc">3</span>🌿<span class="nm">캣닢</span><span class="n">0</span></button>
    </div>
    <div id="hint">바닥의 먹이를 밟으면 주워요 · 보라 점선(기척) 안에 서면 들켜요</div>
  </div>
  <div id="overlay" class="hidden"><div class="panel" id="panel"></div></div>
</div>
<script src="js/data.js"></script>
<script src="js/model.js"></script>
<script src="js/assets.js"></script>
<script src="js/view.js"></script>
<script src="js/audio.js"></script>
<script src="js/controller.js"></script>
</body>
</html>
